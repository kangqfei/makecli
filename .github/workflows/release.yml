name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write   # npm Trusted Publishing（OIDC）：CI 用短期签名 token 发布，不持有长期 NPM_TOKEN

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # GoReleaser 需要完整 git 历史生成 changelog
          submodules: true # 根目录 skills/ submodule 经 embed.go 的 go:embed 参与编译

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 需在仓库 Settings → Secrets 中配置，用于推送 Homebrew Tap
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # 毕业发布时正式 tag 与 beta tag 指向同一 commit，GoReleaser 自动探测会
          # 按版本排序误选 beta（v0.5.8-beta.1 排在 v0.5.8 之上），钉死为触发本次
          # workflow 的 tag
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # -----------------------------------------------------------------
      # npm：主包 @qfeius/makecli 通过 optionalDependencies 钉住 6 个平台子包，
      # 子包携带 GoReleaser 刚构建的二进制；先发子包后发主包，主包永远不指向缺失的子包。
      # beta tag（含 "-"）发到 dist-tag beta，正式 tag 发到 latest，与 [settings] channel 语义一致。
      # 认证走 Trusted Publishing：7 个包在 npmjs.com 各配了 qfeius/makecli + release.yml 的
      # GitHub Actions publisher，npm CLI 用 job 的 OIDC token 换短期发布凭证并自动附带 provenance。
      # -----------------------------------------------------------------
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish npm packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dist_tag=latest
          [[ "$version" != *-* ]] || dist_tag=beta
          # 先完整生成再发布：$(...) 直接放进 for 会吞掉 build 的失败，赋值给变量则受 set -e 保护
          dirs=$(node npm/build.js --version "$version")
          for dir in $dirs; do
            npm publish "$dir" --tag "$dist_tag"
          done
